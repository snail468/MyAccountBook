<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>网络不可用 · 心愿便利贴</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
      }
      body {
        background: #fafafa;
        color: #17171a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e0e11;
          color: #e6e6e9;
        }
      }
      .icon {
        font-size: 3.5rem;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.9rem;
        color: #6b6b73;
        margin: 0 0 1.5rem;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #9c9ca6;
        }
      }
      button {
        appearance: none;
        border: none;
        background: #17171a;
        color: #fff;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #e6e6e9;
          color: #17171a;
        }
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #9c9ca6;
      }
    </style>
  </head>
  <body>
    <div class="icon">📶</div>
    <h1>网络不可用</h1>
    <p>
      检查一下 WiFi 或流量。
      <br />
      在普通账本里现在也能记账 —— 联网后会自动同步。
    </p>
    <button onclick="location.reload()">重新加载</button>
    <div class="hint">离开这个页面前记的账都会保留。</div>
  </body>
</html>
