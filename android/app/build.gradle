plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myaccountbook.twa'
    compileSdk 34

    defaultConfig {
        applicationId 'com.myaccountbook.twa'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        // host + theme colors are injected at build time so the same committed
        // project can target any deployed PWA instance.
        manifestPlaceholders = [
            defaultUrl: (System.getenv('TWA_HOST') ?: 'https://example.com') + '/',
        ]
    }

    signingConfigs {
        release {
            // Keystore is generated by CI at the root project dir (android/release.keystore),
            // so default to rootDir — NOT the app module dir, which is where a bare
            // file('release.keystore') would resolve and fail to find it.
            def ksEnv = System.getenv('TWA_KEYSTORE_FILE')
            def ksFile = ksEnv ? file(ksEnv) : file("${rootDir}/release.keystore")
            storeFile ksFile
            storePassword System.getenv('TWA_KS_PASS')
            keyAlias System.getenv('TWA_KS_ALIAS') ?: 'twa'
            keyPassword System.getenv('TWA_KS_PASS')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AppCompat is required for Theme.AppCompat.* (used by Theme.TwaSplash) and
    // because androidbrowserhelper's LauncherActivity extends AppCompatActivity.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Pinned to 1.4.0 on purpose: androidbrowserhelper 2.5.0 is compiled against
    // this exact browser version, so there is no version conflict and it stays
    // compatible with compileSdk 34 / AGP 8.5.2. (2.6.0 pulls androidx.browser
    // 1.9.0-alpha02 which requires compileSdk 36 + AGP 8.9.1+, breaking the build.)
    implementation 'androidx.browser:browser:1.4.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
