name: myaccountbook
description: "心愿便利贴 - 本地优先的多账本记账 App（Flutter 原生，数据本地存、后台同步）"
publish_to: 'none'
version: 2.0.9+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP 客户端，带拦截器
  dio: ^5.4.3+1
  # 自动管理会话 Cookie（mab_session），持久化到磁盘
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.1
  # 本地 SQLite
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  # 路径拼接（database.dart 直接使用 p.join）
  path: ^1.9.0
  # 状态管理
  provider: ^6.1.2
  # 本地持久化（用户名等轻量信息）
  shared_preferences: ^2.2.3
  # 日期/数字格式化
  intl: ^0.19.0
  # 离线幂等键
  uuid: ^4.4.0
  # 本地图片选择（记账图片改成本地相册上传，取代填链接）[#8]
  image_picker: ">=1.1.2 <1.2.0"
  # 指纹 / 面容识别（生物识别锁）[#4]
  local_auth: ^2.2.0
  # 点击音效：首页/其它页两段 mp3（对齐网页端 home.mp3 / global.mp3）[#2]
  audioplayers: ^6.1.0
  # 文件保存/选择（导出备份自定义路径 + 导入还原选 json 文件）[#导出导入]
  file_picker: ^8.0.0
  # 网络状态响应式监听：重连后自动补推离线队列（配合 AutoSync）。
  # 固定 5.0.2：6.x 需要更高 compileSdk/AGP，与当前 android 配置(AGP 8.1)不兼容。
  connectivity_plus: 5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/audio/home.mp3
    - assets/audio/global.mp3
