name: myaccountbook
description: "心愿便利贴 - 本地优先的多账本记账 App（Flutter 原生，数据本地存、后台同步）"
publish_to: 'none'
version: 2.0.9+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP 客户端，带拦截器
  dio: ^5.4.3+1
  # 自动管理会话 Cookie（mab_session），持久化到磁盘
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.1
  # 本地 SQLite
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  # 状态管理
  provider: ^6.1.2
  # 本地持久化（用户名等轻量信息）
  shared_preferences: ^2.2.3
  # 日期/数字格式化
  intl: ^0.19.0
  # 离线幂等键
  uuid: ^4.4.0
  # 本地图片选择（记账图片改成本地相册上传，取代填链接）[#8]
  image_picker: ">=1.1.2 <1.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
