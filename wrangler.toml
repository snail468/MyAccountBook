# Cloudflare Workers 配置 —— 部署时使用
# 详见 README「Cloudflare Pages 部署」章节
#
# main 和 [assets] 是必填的：@opennextjs/cloudflare **不会**自动往这里写，
# 缺了会报 "Missing entry-point to Worker script or to assets directory"。
# 两个路径都指向 `npm run build:cf` 生成的 .open-next/ 产物。
name = "myaccountbook"
main = ".open-next/worker.js"

compatibility_date = "2025-01-15"
# nodejs_compat —— storage.ts 静态导入了 node:crypto，必须开。
#   在 compatibility_date >= 2024-09-23 时它本身就是 v2 语义，
#   不要再单独写 nodejs_compat_v2（那是旧写法）。
# global_fetch_strictly_public —— 让 fetch 自身公网域名时走真实网络而非内部回环，
#   避免 Next 的内部请求语义出岔子。
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# 静态资源（_next/static、图标、音效）由 Workers Assets 直接服务，不进 Worker
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 刻意不配 ISR 增量缓存（NEXT_INC_CACHE_R2_BUCKET + WORKER_SELF_REFERENCE）
# 和 images binding：本项目所有页面都是 force-dynamic，也没用 next/image，
# 配了只会要求先建一个用不上的 R2 桶。

# 非敏感环境变量。敏感值请用 `npx wrangler secret put NAME`：
#   SESSION_SECRET      —— 会话加密密钥（openssl rand -base64 32，至少 32 字符，
#                          生产环境缺失会直接拒绝启动）
#   TURSO_DATABASE_URL  —— libsql://xxx.turso.io
#   TURSO_AUTH_TOKEN    —— Turso 令牌
#   R2_ACCOUNT_ID       —— Cloudflare 账号 ID
#   R2_ACCESS_KEY       —— R2 API access key
#   R2_SECRET_KEY       —— R2 API secret
#   R2_BUCKET           —— 图片上传用的存储桶名
[vars]
NODE_ENV = "production"
COOKIE_SECURE = "true"
