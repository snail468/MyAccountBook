services:
  app:
    # 从 GHCR 拉取（推荐 —— 用 GitHub Actions 自动构建后你的服务器只需 pull + up）
    image: ghcr.io/snail46/myaccountbook:latest
    # 想在服务器上本地构建镜像，把 image 那行注释掉、启用下面 build 即可
    # build: .
    container_name: myaccountbook
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 至少 32 字符的随机字符串！生成： openssl rand -base64 32
      SESSION_SECRET: "${SESSION_SECRET:?请在 .env 里设置 SESSION_SECRET}"
      # 数据库文件放在挂载卷里
      DATABASE_URL: "file:/data/app.db"
      # HTTPS 上线后再改成 true；HTTP 部署保持 false，否则登录 cookie 被浏览器拒收
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      NODE_ENV: production
    volumes:
      - ./data:/data
    healthcheck:
      # 打 /api/health 而不是 / —— 后者只证明进程活着，
      # 前者会真的查一次数据库，volume 没挂对或文件权限错时能立刻暴露
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
