name: Build & publish Docker image

# 触发方式
#   push 到 main      → 产出 latest + sha-xxxxxxx
#   打 v*.*.* 标签    → 产出版本号标签
#   手动 workflow_dispatch → 可**指定任意分支**构建，产出分支名标签 + sha-xxxxxxx
#
# 注意 latest 带 enable={{is_default_branch}} 守卫：只有 main 会产出 latest。
# 所以手动构建功能分支**不会**影响生产环境的 `docker compose pull`。
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把实际推上去的标签写进任务摘要 —— 手动构建分支时不用再猜标签名叫什么，
      # 直接从 Actions 页面复制到服务器上 docker pull 即可。
      - name: 输出可拉取的镜像标签
        run: |
          {
            echo "## 可拉取的镜像"
            echo
            echo '分支/引用：`${{ github.ref_name }}`'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "在服务器上拉取："
            echo '```bash'
            echo "docker pull $(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
