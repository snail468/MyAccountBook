name: CI

# 原来只有构建镜像的 workflow，没有任何代码检查 —— 类型错误/lint 问题
# 要等到 Docker 构建那一步才炸，而且测试根本没跑过。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 有 lockfile 就用 npm ci 保证可复现，没有则退回 npm install
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # tsc 需要生成好的 prisma client 才能过
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # next build 会在收集页面数据时真连数据库，所以先建一个空库
      - name: Build
        env:
          DATABASE_URL: file:./ci.db
          SESSION_SECRET: ci-only-placeholder-secret-at-least-32-chars
        run: |
          npx prisma migrate deploy
          npm run build
