name: CI

# 合并前的两个 workflow（ci.yml + docker-publish.yml）曾并行跑：
# 坏提交会白白花掉一次多架构镜像构建时间。现在改成 verify → docker，
# tsc/lint/test/build 任一挂了就不再去构镜像。
#
# 触发矩阵：
#   push 到任意分支 / PR / 手动 dispatch → verify
#   push 到 main / 打 v*.*.* 标签 / 手动 dispatch → verify → docker
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
    # Flutter-only 改动（仅 mobile/**）不触发 web 构建：Flutter 端改完只想要 APK
    # （见 flutter.yml），不应连带跑 web verify + docker 多架构构建。
    # 若某次提交同时动了服务端与 mobile，仍会正常触发 web CI。
    paths-ignore: ['mobile/**']
  pull_request:
    paths-ignore: ['mobile/**']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 已 EOL，GitHub Actions 也在下线它。22 是当前 LTS，
          # 与 Dockerfile 的基础镜像保持一致，避免 CI 测的和生产跑的不是一个大版本。
          node-version: 22
          # 注意：cache: npm 要求仓库里必须有 package-lock.json，
          # 缺了会直接报 "Dependencies lock file is not found" 而不是降级
          cache: npm

      - name: Install deps
        run: npm ci

      # tsc 需要生成好的 prisma client 才能过
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # next build 会在收集页面数据时真连数据库，所以先建一个空库
      - name: Build
        env:
          DATABASE_URL: file:./ci.db
          SESSION_SECRET: ci-only-placeholder-secret-at-least-32-chars
        run: |
          npx prisma migrate deploy
          npm run build

  # 只在 push 到 main / 打 tag / 手动 dispatch 时构镜像。
  # PR 与其它分支的 push 只跑 verify，别浪费镜像仓库配额和多架构构建时间。
  docker:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # gha 后端会把 Dockerfile 里的 --mount=type=cache 也一起持久化，
          # 所以下一次构建时 .next/cache 和 npm/prisma engines 缓存都还在
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把实际推上去的标签写进任务摘要 —— 手动构建分支时不用再猜标签名叫什么，
      # 直接从 Actions 页面复制到服务器上 docker pull 即可。
      - name: 输出可拉取的镜像标签
        run: |
          {
            echo "## 可拉取的镜像"
            echo
            echo '分支/引用：`${{ github.ref_name }}`'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "在服务器上拉取："
            echo '```bash'
            echo "docker pull $(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
