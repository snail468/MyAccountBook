name: Android APK (TWA)

# 用 TWA (Trusted Web Activity) 把已托管的 PWA 打包成可侧载的安卓 APK。
# 本仓库直接提交了一份手写的最小 TWA Android Gradle 工程（android/ 目录），
# 由 Gradle 直接编译、用签名密钥库产出自签名的 release APK，全程无交互命令
# （Bubblewrap 的 init/build 在 CI 无 TTY 时会挂起，因此不采用）。
#
# 触发方式（刻意不挂到每次 push，避免浪费构建时长）：
#   - 打 v*.*.* 标签时自动构建
#   - 在 Actions 页面手动 dispatch（可填 host 覆盖变量）
#
# 前置（先在仓库 Settings → Secrets and variables → Actions 配置）：
#   - Variables.TWA_HOST：PWA 公网地址，含 https://、不含末尾斜杠，例如 https://book.example.com
#   - Secrets.TWA_KEYSTORE_BASE64：签名密钥库 base64（首次构建会自动生成并打印，复制存进来即可长期稳定）
#   - Secrets.TWA_KEYSTORE_PASSWORD：密钥库密码（与下面 KS_PASS 默认一致；若用自举密钥请同步）
#
# 跨设备同步说明：本应用数据存服务端 SQLite（你已有的 Docker 部署），
# 多设备用同一账号登录该地址即天然同步，离线记账的 offlineQueue 已做幂等。
# APK 仅是加载该 PWA 的壳，不另存数据。

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      host:
        description: 'PWA 公网地址 (https:// 开头，不含末尾斜杠)，覆盖 TWA_HOST 变量'
        required: false

permissions:
  contents: write

env:
  PACKAGE_ID: com.myaccountbook.twa
  KS_ALIAS: twa
  KS_PASS: twa12345
  GRADLE_VERSION: 8.9

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Gradle / Android build 需要)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android platform & build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 确定 TWA host
        id: host
        run: |
          HOST="${{ github.event.inputs.host || vars.TWA_HOST }}"
          if [ -z "$HOST" ]; then
            echo "::error::未设置 TWA host。请到仓库 Settings → Variables 设置 TWA_HOST，或在手动触发时填写 host 输入。"
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: 准备签名密钥库（优先用 secret，缺失则自举生成）
        id: keystore
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
        run: |
          cd android
          PASS="${SECRET_KS_PASS:-${{ env.KS_PASS }}}"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "from_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未设置 TWA_KEYSTORE_BASE64，本次自举生成密钥库。构建完成后请把下方打印的 base64 存为 secret，否则下次密钥变化会导致已装 APK 无法覆盖更新。"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "${{ env.KS_ALIAS }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=MyAccountBook, O=MyAccountBook, C=CN"
            echo "from_secret=false" >> "$GITHUB_OUTPUT"
            B64=$(base64 -w0 release.keystore)
            {
              echo "keystore_b64<<EOF"
              echo "$B64"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "ks_pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: 下载 Gradle 发行版
        run: |
          cd android
          curl -sSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip"
          unzip -q gradle.zip
          echo "$PWD/gradle-${{ env.GRADLE_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: 生成 local.properties（指向 Android SDK）
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 编译并签名 release APK
        env:
          TWA_HOST: ${{ steps.host.outputs.host }}
          TWA_KS_PASS: ${{ steps.keystore.outputs.ks_pass }}
          TWA_KS_ALIAS: ${{ env.KS_ALIAS }}
        run: |
          cd android
          gradle assembleRelease --no-daemon
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "::error::未找到生成的 APK"; exit 1; fi
          cp "$APK" "../myaccountbook-${{ env.PACKAGE_ID }}.apk"
          echo "apk=myaccountbook-${{ env.PACKAGE_ID }}.apk" >> "$GITHUB_OUTPUT"

      - name: 计算 assetlinks 指纹（可选数字资产校验）
        id: fp
        run: |
          cd android
          keytool -exportcert -alias "${{ env.KS_ALIAS }}" \
            -keystore release.keystore \
            -storepass "${{ steps.keystore.outputs.ks_pass }}" \
            -keypass "${{ steps.keystore.outputs.ks_pass }}" \
            -file twa-cert.der
          # assetlinks.json 要求十六进制冒号分隔格式（非 base64），
          # 否则 Chrome 校验不通过、地址栏无法隐藏。
          FP=$(openssl x509 -in twa-cert.der -inform DER -noout -fingerprint -sha256 | sed 's/^SHA256 Fingerprint=//')
          echo "fp=$FP" >> "$GITHUB_OUTPUT"

      - name: 生成并自动提交 assetlinks.json（隐藏地址栏）
        env:
          FP: ${{ steps.fp.outputs.fp }}
          PKG: ${{ env.PACKAGE_ID }}
        run: |
          set -euo pipefail
          mkdir -p public/.well-known
          # 直接用当前密钥库指纹生成，确保与生产中 APK 的签名一致
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "%s",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$PKG" "$FP" > public/.well-known/assetlinks.json
          # 仅在内容变化时提交回 main；push 到 main 会触发 ci.yml 重建 Docker 镜像并托管该文件
          if git diff --quiet -- public/.well-known/assetlinks.json 2>/dev/null; then
            echo "assetlinks.json 无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/.well-known/assetlinks.json
            git commit -m "ci(android): 自动写入 TWA assetlinks.json 指纹

          由 Android APK 构建流程根据当前签名密钥库自动生成，确保指纹与
          生产密钥一致；变更密钥后重建即自动更新。提交到 main 会触发 CI
          重新构建 Docker 镜像并托管该文件，无需手动部署。"
            if git push origin HEAD:main; then
              echo "已自动提交 assetlinks.json 到 main（将触发 Docker 重新部署）"
            else
              echo "::warning::推送到 main 失败（可能 main 已领先于本次标签）。请手动将 public/.well-known/assetlinks.json 合并到 main 以启用隐藏地址栏。"
            fi
          fi

      - name: 输出配置摘要
        run: |
          {
            echo "## TWA APK 构建完成"
            echo
            echo "包名：\`${{ env.PACKAGE_ID }}\`"
            echo
            echo "### 1) 若本次为自举密钥，请把下面这段 base64 存为仓库 Secret \`TWA_KEYSTORE_BASE64\`（并在 Secrets 设 \`TWA_KEYSTORE_PASSWORD\` = \`${{ steps.keystore.outputs.ks_pass }}\`）"
            echo
            echo '```'
            echo "${{ steps.keystore.outputs.keystore_b64 }}"
            echo '```'
            echo
            echo "### 2) 隐藏地址栏（TWA 数字资产校验，已自动化）"
            echo "上面的指纹已由构建流程自动写入 \`public/.well-known/assetlinks.json\` 并提交到 main（会触发 Docker 重新部署），使其可通过 \`${{ steps.host.outputs.host }}/.well-known/assetlinks.json\` 访问。无需手动操作。"
            echo
            echo '```json'
            echo "[{"
            echo "  \"relation\": [\"delegate_permission/common.handle_all_urls\"],"
            echo "  \"target\": {"
            echo "    \"namespace\": \"android_app\","
            echo "    \"package_name\": \"${{ env.PACKAGE_ID }}\","
            echo "    \"sha256_cert_fingerprints\": [\"${{ steps.fp.outputs.fp }}\"]"
            echo "  }"
            echo "}]"
            echo '```'
            echo
            echo "该文件已随本提交自动托管到你的部署域名，APK 重装后地址栏即可隐藏。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccountbook-apk
          path: "myaccountbook-${{ env.PACKAGE_ID }}.apk"
          if-no-files-found: error
