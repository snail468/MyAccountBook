name: Flutter APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: Scaffold Android platform
        # 本地无法跑 Flutter，由 CI 用 flutter create 生成正确的 android/ 工程
        # （含 gradle wrapper / AndroidManifest / build.gradle）。
        # 注意：lib/main.dart 已随仓库提交（且会被 GitHub 检出），flutter create
        # 对已存在的源文件**不会**覆盖，因此这里绝不会变成默认计数器模板。
        working-directory: mobile
        run: flutter create --org com.myaccountbook --platforms=android .

      - name: Verify lib/main.dart is our real app (not scaffold default)
        # 兜底断言：如果未来 flutter 行为变化导致 lib/main.dart 被覆盖，立即失败。
        working-directory: mobile
        run: |
          if grep -q "Flutter Demo Home Page" lib/main.dart; then
            echo "::error::lib/main.dart was overwritten by flutter create scaffold! Reverting to scaffold default counter app."
            exit 1
          fi
          echo "OK: lib/main.dart is our real app entry."

      - name: Set app name (label) to 心愿便利贴
        # 覆盖 flutter create 生成的 AndroidManifest 默认 android:label="myaccountbook"。
        run: |
          sed -i 's#android:label="[^"]*"#android:label="心愿便利贴"#' \
            mobile/android/app/src/main/AndroidManifest.xml

      - name: Generate app icon from project original (icon-512.png)
        # 用项目原有图标（public/icon-512.png）替换 flutter create 的默认 Flutter logo。
        # ubuntu-latest 预装 Python3，Pillow 现装（ImageMagick convert 不在 PATH）。
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 -c "
          from PIL import Image
          img = Image.open('public/icon-512.png')
          for density, size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              d = f'mobile/android/app/src/main/res/mipmap-{density}'
              r = img.resize((size, size), Image.LANCZOS)
              r.save(f'{d}/ic_launcher.png')
              r.save(f'{d}/ic_launcher_round.png')
          print('App icons generated from public/icon-512.png')
          "

      - name: Inject app version from git tag
        # 把 v2.0.10 这种 tag 去掉 v 前缀写入 AppConfig.appVersion（首页标题栏可见），
        # 同时把 pubspec.yaml 的 version 也带上（Android 系统侧版本号）。
        # versionCode 从 tag 推导（2.0.24 -> 20024），保证每次发版都是递增的版本号，
        # 升级安装时不会被判定为"相同/更低版本"而要求先卸载。
        run: |
          TAG=${GITHUB_REF_NAME#v}
          IFS='.' read -r MAJ MIN PAT <<< "$TAG"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          sed -i "s/static const String appVersion = '.*'/static const String appVersion = '${TAG}'/" \
            mobile/lib/core/constants.dart
          sed -i "s/^version: .*/version: ${TAG}+${CODE}/" mobile/pubspec.yaml

      - name: Ensure INTERNET permission (release build needs it)
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.INTERNET"/>\n</manifest>#' \
            mobile/android/app/src/main/AndroidManifest.xml

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Decode Android signing key (if secret provided)
        # 解决"安装冲突需先卸载"：GitHub 托管的 runner 每次重新生成 debug 密钥
        # （随机密钥对），导致同一包名不同签名 → 升级安装被拒。用固定 release 密钥
        # 后所有构建签名一致，升级无需卸载。未配置 secret 时回退 debug 签名。
        # 注意：GitHub Actions 的 step 级 if 不能引用 secrets 上下文，故改用
        # env 传参（env 允许引用 secrets）+ 脚本内判空，效果等价。
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret 未配置，使用默认 debug 签名。"
            exit 0
          fi
          base64 -d <<< "$KEYSTORE_B64" > mobile/android/app/upload-keystore.p12
          printf 'storeFile=upload-keystore.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PW" "$KEY_ALIAS" "$KEY_PW" > mobile/android/key.properties

      - name: Apply release signing config
        # 仅当 key.properties 存在（即已配置签名 secret）时才把 build.gradle
        # 切换到 release 签名；否则保持默认 debug 签名。
        run: |
          python3 - <<'PY'
          import pathlib
          kp = pathlib.Path('mobile/android/key.properties')
          if not kp.exists():
              print('未检测到 key.properties（签名 secret 未配置），保持默认 debug 签名，跳过 patch。')
          else:
              p = pathlib.Path('mobile/android/app/build.gradle')
              s = p.read_text(encoding='utf-8')
              if 'signingConfigs {' not in s:
                  block = (
                      "    signingConfigs {\n"
                      "        release {\n"
                      "            def keyProps = new File(rootProject.projectDir, 'key.properties')\n"
                      "            if (keyProps.exists()) {\n"
                      "                Properties props = new Properties()\n"
                      "                props.load(new FileInputStream(keyProps))\n"
                      "                storeFile file(props['storeFile'])\n"
                      "                storeType 'PKCS12'\n"
                      "                storePassword props['storePassword']\n"
                      "                keyAlias props['keyAlias']\n"
                      "                keyPassword props['keyPassword']\n"
                      "            } else {\n"
                      "                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')\n"
                      "                storePassword 'android'\n"
                      "                keyAlias 'androiddebugkey'\n"
                      "                keyPassword 'android'\n"
                      "            }\n"
                      "        }\n"
                      "    }\n\n"
                  )
                  s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
              s = s.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
              p.write_text(s, encoding='utf-8')
              print('patched build.gradle for release signing')
          PY

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccountbook-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
