name: Flutter APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: Scaffold Android platform
        # 本地无法跑 Flutter，由 CI 用 flutter create 生成正确的 android/ 工程
        # （含 gradle wrapper / AndroidManifest / build.gradle），不会覆盖 lib/。
        working-directory: app
        run: flutter create --org com.myaccountbook --platforms=android .

      - name: Ensure INTERNET permission (release build needs it)
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.INTERNET"/>\n</manifest>#' \
            app/android/app/src/main/AndroidManifest.xml

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccountbook-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
