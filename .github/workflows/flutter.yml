name: Flutter APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-licenses: true

      - name: Scaffold Android platform
        # 本地无法跑 Flutter，由 CI 用 flutter create 生成正确的 android/ 工程
        # （含 gradle wrapper / AndroidManifest / build.gradle）。
        # 注意：lib/main.dart 已随仓库提交（且会被 GitHub 检出），flutter create
        # 对已存在的源文件**不会**覆盖，因此这里绝不会变成默认计数器模板。
        working-directory: app
        run: flutter create --org com.myaccountbook --platforms=android .

      - name: Verify lib/main.dart is our real app (not scaffold default)
        # 兜底断言：如果未来 flutter 行为变化导致 lib/main.dart 被覆盖，立即失败。
        working-directory: app
        run: |
          if grep -q "Flutter Demo Home Page" lib/main.dart; then
            echo "::error::lib/main.dart was overwritten by flutter create scaffold! Reverting to scaffold default counter app."
            exit 1
          fi
          echo "OK: lib/main.dart is our real app entry."

      - name: Set app name (label) to 心愿便利贴
        # 覆盖 flutter create 生成的 AndroidManifest 默认 android:label="myaccountbook"。
        run: |
          sed -i 's#android:label="[^"]*"#android:label="心愿便利贴"#' \
            app/android/app/src/main/AndroidManifest.xml

      - name: Generate app icon from project original (icon-512.png)
        # 用项目原有图标（public/icon-512.png）替换 flutter create 的默认 Flutter logo。
        # ubuntu-latest 预装 Python3，Pillow 现装（ImageMagick convert 不在 PATH）。
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 -c "
          from PIL import Image
          img = Image.open('public/icon-512.png')
          for density, size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              d = f'app/android/app/src/main/res/mipmap-{density}'
              r = img.resize((size, size), Image.LANCZOS)
              r.save(f'{d}/ic_launcher.png')
              r.save(f'{d}/ic_launcher_round.png')
          print('App icons generated from public/icon-512.png')
          "

      - name: Ensure INTERNET permission (release build needs it)
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.INTERNET"/>\n</manifest>#' \
            app/android/app/src/main/AndroidManifest.xml

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myaccountbook-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
